[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-research-lab"
version = "0.1.0"
description = "Bounded OpenAlex research collector"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
horizon = "horizon.collector:main"

[tool.setuptools.packages.find]
include = ["horizon*"]
