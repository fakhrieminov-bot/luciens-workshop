name: Collect research
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: horizon-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      HORIZON_QUERY: ${{ vars.HORIZON_QUERY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check configuration
        shell: bash
        run: |
          test -n "$OPENALEX_API_KEY" || { echo 'Set the OPENALEX_API_KEY repository secret'; exit 1; }
          test -n "$HORIZON_QUERY" || { echo 'Set the HORIZON_QUERY repository variable'; exit 1; }
      - name: Collect one bounded search
        run: python -m horizon --query "$HORIZON_QUERY" --limit 25
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horizon-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 30
          if-no-files-found: error
